name: Teamwork -> BigQuery sync

# Runs the Teamwork -> BigQuery sync script automatically, twice a day.
#
# Schedule below is 04:15 and 16:15 UTC — deliberately NOT on the hour.
# GitHub's own docs warn that scheduled workflows are most likely to be
# delayed when set to fire exactly at :00, since that's the most congested
# slot across all of GitHub Actions. Confirmed on this repo: 9 consecutive
# scheduled firings at the old 0 5,17 * * * schedule showed delays ranging
# from 10 minutes to over 8 hours, with gaps between fires as uneven as
# ~8-18 hours instead of a steady ~12 (see teamwork_bigquery_sync/README.md
# "Known gaps" for the documented run-by-run data). This offset won't
# necessarily eliminate multi-hour delays entirely, but avoiding :00 is a
# cheap, documented first mitigation; escalate to a more reliable
# scheduler (e.g. Cloud Scheduler + Cloud Run) if delays are still
# unacceptable after this change.
#
# 04:15/16:15 UTC is 12:15am / 12:15pm US Eastern Daylight Time (in effect
# roughly mid-March to early November — GitHub Actions cron does not know
# about daylight saving, so this drifts to 11:15pm-previous-day / 11:15am
# Eastern Standard Time for the rest of the year). If exact clock-hour
# timing matters year-round, ask to add DST-aware gating — for now this
# keeps things simple.
on:
  schedule:
    - cron: '15 4,16 * * *'
  # Lets you trigger a run manually from the "Actions" tab in GitHub,
  # instead of waiting for the schedule — useful for testing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (checks Teamwork connectivity, writes nothing to BigQuery)"
        type: boolean
        default: false
      explain_task_scope:
        description: "Explain task scope only — prints which projects the tasks pull covers and the exact task count per candidate scope. Reads only, writes nothing"
        type: boolean
        default: false
      backfill_months:
        description: "Backfill months instead of a normal run, e.g. 2026-01,2026-02,2026-03 (leave blank for a normal run)"
        type: string
        default: ""
      create_views:
        description: "(Re)create the exception/QC reporting views only — no Teamwork pull, no table data touched"
        type: boolean
        default: false

permissions:
  contents: read

# Prevents two runs from overlapping if a manual run and a scheduled run
# happen to land at the same time.
concurrency:
  group: teamwork-bigquery-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamwork_bigquery_sync
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP service account key to a file
        run: echo "$GCP_SA_KEY_JSON" > "$RUNNER_TEMP/gcp-sa-key.json"
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}

      # Dispatch inputs are passed through `env:` rather than interpolated
      # into the shell body with ${{ }} — a value like `"; curl ... | sh; echo "`
      # would otherwise be executed by the runner. On a `schedule` event the
      # inputs are empty, so this falls through to a normal full sync.
      - name: Run sync
        env:
          TEAMWORK_API_KEY: ${{ secrets.TEAMWORK_API_KEY }}
          TEAMWORK_BASE_URL: ${{ secrets.TEAMWORK_BASE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa-key.json
          GCP_PROJECT_ID: radiant-rig-284611
          BQ_DATASET: teamwork_data
          BQ_LOCATION: US
          SYNC_TIMEZONE: America/New_York
          EXPLAIN_TASK_SCOPE: ${{ inputs.explain_task_scope }}
          CREATE_VIEWS: ${{ inputs.create_views }}
          BACKFILL_MONTHS: ${{ inputs.backfill_months }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EXPLAIN_TASK_SCOPE" = "true" ]; then
            python sync.py --explain-task-scope
          elif [ "$CREATE_VIEWS" = "true" ]; then
            python sync.py --create-views
          elif [ -n "$BACKFILL_MONTHS" ]; then
            python sync.py --backfill-months "$BACKFILL_MONTHS"
          elif [ "$DRY_RUN" = "true" ]; then
            python sync.py --dry-run
          else
            python sync.py
          fi
