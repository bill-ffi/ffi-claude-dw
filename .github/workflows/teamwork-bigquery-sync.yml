name: Teamwork -> BigQuery sync

# Runs the Teamwork -> BigQuery sync script automatically, twice a day at
# 11:15 and 16:15 UTC.
#
#   11:15 UTC = 07:15 US Eastern Daylight Time / 06:15 Eastern Standard Time
#   16:15 UTC = 12:15 EDT / 11:15 EST
#
# GitHub Actions cron is always UTC and has no DST awareness, so the UTC
# times above are fixed and the Eastern clock times shift by an hour twice
# a year. The times were specified in UTC, so that is treated as the
# contract; ask for DST-aware gating if the Eastern times are what must
# stay fixed.
#
# NOTE ON SPACING: these two slots are 5 hours apart, then 19 hours to the
# next day's first run — deliberately front-loaded onto the US business
# morning rather than evenly spaced. (The previous 04:15/16:15 schedule was
# an even 12h/12h.) That means Teamwork activity logged after ~12:15 ET is
# not reflected in BigQuery until the following morning.
#
# The :15 offset is deliberate — GitHub's docs warn that scheduled
# workflows are most likely to be delayed when set to fire exactly at :00,
# the most congested slot across all of Actions. Confirmed on this repo: 9
# consecutive firings at the original 0 5,17 * * * schedule showed delays
# from 10 minutes to over 8 hours (see teamwork_bigquery_sync/README.md
# "Known gaps" for the run-by-run data). Moving off :00 is a cheap first
# mitigation, not a guarantee; escalate to Cloud Scheduler + Cloud Run if
# multi-hour delays persist.
#
# REMINDER: `schedule:` only ever fires from the repository's DEFAULT
# branch. Editing the cron on a feature branch changes nothing until that
# branch is merged.
on:
  schedule:
    - cron: '15 11,16 * * *'
  # Lets you trigger a run manually from the "Actions" tab in GitHub,
  # instead of waiting for the schedule — useful for testing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (checks Teamwork connectivity, writes nothing to BigQuery)"
        type: boolean
        default: false
      explain_task_scope:
        description: "Explain task scope only — prints which projects the tasks pull covers and the exact task count per candidate scope. Reads only, writes nothing"
        type: boolean
        default: false
      backfill_months:
        description: "Backfill months instead of a normal run, e.g. 2026-01,2026-02,2026-03 (leave blank for a normal run)"
        type: string
        default: ""
      create_views:
        description: "(Re)create the exception/QC reporting views only — no Teamwork pull, no table data touched"
        type: boolean
        default: false

permissions:
  contents: read

# Prevents two runs from overlapping if a manual run and a scheduled run
# happen to land at the same time.
concurrency:
  group: teamwork-bigquery-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A hung run would hold the concurrency group above and silently stall
    # every subsequent scheduled sync until someone noticed. A normal full
    # sync takes ~2 minutes.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: teamwork_bigquery_sync
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP service account key to a file
        run: echo "$GCP_SA_KEY_JSON" > "$RUNNER_TEMP/gcp-sa-key.json"
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}

      # Dispatch inputs are passed through `env:` rather than interpolated
      # into the shell body with ${{ }} — a value like `"; curl ... | sh; echo "`
      # would otherwise be executed by the runner. On a `schedule` event the
      # inputs are empty, so this falls through to a normal full sync.
      - name: Run sync
        env:
          TEAMWORK_API_KEY: ${{ secrets.TEAMWORK_API_KEY }}
          TEAMWORK_BASE_URL: ${{ secrets.TEAMWORK_BASE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa-key.json
          GCP_PROJECT_ID: radiant-rig-284611
          BQ_DATASET: teamwork_data
          BQ_LOCATION: US
          SYNC_TIMEZONE: America/New_York
          EXPLAIN_TASK_SCOPE: ${{ inputs.explain_task_scope }}
          CREATE_VIEWS: ${{ inputs.create_views }}
          BACKFILL_MONTHS: ${{ inputs.backfill_months }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EXPLAIN_TASK_SCOPE" = "true" ]; then
            python sync.py --explain-task-scope
          elif [ "$CREATE_VIEWS" = "true" ]; then
            python sync.py --create-views
          elif [ -n "$BACKFILL_MONTHS" ]; then
            python sync.py --backfill-months "$BACKFILL_MONTHS"
          elif [ "$DRY_RUN" = "true" ]; then
            python sync.py --dry-run
          else
            python sync.py
          fi
